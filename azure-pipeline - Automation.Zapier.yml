trigger:
  branches:
    include:
    - main-v17
    - v17/dev
  paths:
    include:
    - src/Umbraco.Forms.Integrations.Automation.Zapier/**
    - azure-pipeline - Automation.Zapier.yml

pool:
  vmImage: 'windows-latest'

variables:
  nodeVersion: '>=22'
  projectName: 'Umbraco.Forms.Integrations.Automation.Zapier'
  project: 'src/$(projectName)/$(projectName).csproj'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:
- task: NuGetToolInstaller@1
  displayName: 'Install NuGet'

- task: NuGetCommand@2
  displayName: 'NuGet Restore'
  inputs:
    command: 'restore'
    feedsToUse: 'select'
    projects: '$(project)'
    includeNuGetOrg: true

- task: UseDotNet@2
  displayName: 'Use SDK version 10.0.100'
  inputs:
    packageType: 'sdk'
    version: '10.0.100'

- task: VSBuild@1
  displayName: 'Build Project'
  inputs:
    solution: '$(project)'
    msbuildArgs: '/p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:SkipInvalidConfigurations=true /p:PackageLocation="$(build.artifactStagingDirectory)"'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'

- task: DotNetCoreCLI@2
  displayName: 'Create NuGet Package'
  inputs:
    command: 'pack'
    arguments: '--configuration $(buildConfiguration)'
    packagesToPack: '$(project)'
    versioningScheme: 'off'

- task: CmdLine@2
  displayName: 'Create Umbraco Package'
  inputs:
    script: |
      dotnet tool install --global Umbraco.Tools.Packages
      cd src/$(projectName)/
      umbpack pack .\package.xml -o $(Build.ArtifactStagingDirectory)
      cd ../../
  condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')    
- task: PublishBuildArtifacts@1
  displayName: 'Publish Build Artifacts'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'

# Generate/upload SBOM with cdxgen
- script: |
    cd $(Build.SourcesDirectory)
    npm install --global @cyclonedx/cdxgen
  displayName: 'Install cdxgen'

- script: |
    mkdir -p $(Build.ArtifactStagingDirectory)/bom
    cd $(Build.SourcesDirectory)
    cdxgen --recurse \
      --output $(Build.ArtifactStagingDirectory)/bom/bom.json \
      --json-pretty \
      --project-group "DXP" \
      --project-name "Umbraco.Forms.Integrations.Automation.Zapier" \
      --project-version "v17" \
      --server-url "$(DT_BASE_URL)" \
      --api-key "$(DT_API_KEY)"
    displayName: 'Generate & upload SBOM with cdxgen'
    env:
      DT_API_KEY: $(dtApiKey)
      DT_BASE_URL: "https://ca-live-global-dtrack-api.purplemoss-6e7d841c.westeurope.azurecontainerapps.io"

- task: PublishPipelineArtifact@1
displayName: 'Publish SBOM Artifact'
inputs:
  targetPath: $(Build.ArtifactStagingDirectory)/bom
  artifactName: SBOM